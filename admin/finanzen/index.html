<style>
  :root{--black:#1a1a1a;--red:#cc0000;--green:#0a8f38;--bg:#fff;--bg2:#f5f5f5;--gray:#ccc;--gray-mid:#ddd;--t1:#1a1a1a;--t2:#555;--t3:#999;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--t1);background:var(--bg2);font-size:14px;}
  header{background:var(--black);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;}
  header .ver{color:#888;font-size:11px;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px;}
  .btn{height:36px;padding:0 16px;border:2px solid var(--black);background:var(--bg);color:var(--black);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--black);color:#fff;}
  .btn-red{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-red:hover{background:#a00;}
  .btn-sm{height:30px;padding:0 12px;font-size:11px;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  .card{background:var(--bg);border:1px solid var(--gray-mid);padding:18px 20px;margin-bottom:16px;}
  .card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;border-bottom:2px solid var(--black);padding:5px 6px;font-size:12px;}
  td{padding:3px 6px;border-bottom:1px solid var(--gray-mid);}
  .in{width:100%;height:30px;padding:0 6px;border:1px solid var(--gray-mid);}
  .num{text-align:right;}
  .menu{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .menu button{height:34px;padding:0 14px;border:1px solid var(--gray-mid);background:var(--bg);cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;}
  .menu button.active{background:var(--black);color:#fff;border-color:var(--black);}
  .sec{display:none;}.sec.active{display:block;}
  .gate{max-width:360px;margin:60px auto;background:var(--bg);border:1px solid var(--gray-mid);padding:26px;}
  .gate h2{margin:0 0 6px;font-size:16px;}.gate p{color:var(--t3);font-size:13px;margin:0 0 16px;}
  .err{color:var(--red);font-size:13px;margin-top:8px;}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--gray-mid);}
  .kv.sub{font-weight:600;background:var(--bg2);padding:5px 8px;border-bottom:none;}
  .kv.total{font-weight:700;border-top:2px solid var(--black);border-bottom:none;padding-top:8px;}
  .muted{color:var(--t3);}.pos{color:var(--green);}.neg{color:var(--red);}
  label.fld{display:block;font-size:12px;color:var(--t2);margin-bottom:10px;}
  label.fld input,label.fld textarea{display:block;margin-top:3px;width:100%;}
  .menu button{font-weight:400;}
  .menu button[data-s="abrechnung"]{font-weight:700;}
  .menu button[data-s="einnahmen"]:not(.active){background:#e8f5e9;border-color:#c8e6cd;}
  .menu button[data-s="rechnungen"]:not(.active){background:#e8f5e9;border-color:#c8e6cd;}
  .menu button[data-s="ausgaben"]:not(.active){background:#fdeaea;border-color:#f5c9c9;}
  .menu button[data-s="stock"]:not(.active){background:#fff8e1;border-color:#f2e4b3;}
  .menu button[data-s="kasse"]:not(.active){background:#fff8e1;border-color:#f2e4b3;}
  .menu button[data-s="twint"]:not(.active){background:#e7f0fb;border-color:#c3d9f5;}
  .detrow{display:none;}
  .detrow.show{display:table-row;}
  .detrow.db{font-weight:700;}
  .kpi-i{position:absolute;top:8px;right:9px;width:15px;height:15px;border:1px solid #bbb;border-radius:50%;color:#999;font-size:10px;line-height:14px;text-align:center;cursor:help;font-family:Georgia,serif;font-style:italic;}
  .kpi-i:hover{border-color:#888;color:#555;}
  .kpi-i:hover::after{content:attr(data-tip);position:absolute;top:19px;right:-2px;width:180px;background:#1a1a1a;color:#fff;font-size:11px;font-style:normal;font-family:Arial,sans-serif;font-weight:400;line-height:1.35;text-align:left;padding:7px 9px;border-radius:4px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .menu button[data-s="spaetzli"]{color:#c2185b;}
  .menu button[data-s="spaetzli"]:not(.active){background:#fce4ec;border-color:#f8bbd0;}
  .menu button[data-s="spaetzli"].active{background:#e91e63;border-color:#e91e63;color:#fff;}
  @media print {
    body.abr-printing header, body.abr-printing .menu, body.abr-printing #saveStatus { display:none !important; }
    body.abr-printing .sec { display:none !important; }
    body.abr-printing #sec-abrechnung { display:block !important; }
    body.abr-printing #abrPrintWrap { break-before:page; page-break-before:always; }
    body.abr-printing #sec-abrechnung .card { break-inside:avoid; }
    body.abr-printing .kpi-i { display:none !important; }
    body.abr-printing .auswert-grid { grid-template-columns:repeat(2,1fr) !important; }
    @page { size: A4 portrait; margin:12mm; }
  }
  #abrPrintWrap { display:none; }
  @media print { body.abr-printing #abrPrintWrap { display:block !important; } }
  .auswert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 24px;}
  .auswert-cell .auswert-h{font-weight:600;font-size:12px;margin-bottom:8px;}
  .auswert-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .auswert-leg{flex:1 1 150px;min-width:120px;}
  @media (max-width:640px){ .auswert-grid{grid-template-columns:1fr;} }
</style>
</head>

function applyData(data){
  const m=data.meta||{};
  if(m.Jahr) FIN.jahr=String(m.Jahr);
  if(m.Vorjahr) FIN.vorjahr=String(m.Vorjahr);
  if(m.VorjahrKasse!=null) FIN.vorjahrKasse=String(m.VorjahrKasse);
  if(m.EinnahmenKategorien) FIN.einKat=String(m.EinnahmenKategorien).split(',').map(x=>x.trim()).filter(Boolean);
  if(m.AusgabenKategorien) FIN.ausKat=String(m.AusgabenKategorien).split(',').map(x=>x.trim()).filter(Boolean);
  if(m.KostenKategorien) FIN.kostKat=String(m.KostenKategorien).split(',').map(x=>x.trim()).filter(Boolean);
  if(m.SollStock!=null) FIN.stock.soll=String(m.SollStock);
  if(m.SollKasse!=null) FIN.kasse.soll=String(m.SollKasse);
  if(m.RgAbsender) FIN.rgAbsender=String(m.RgAbsender);
  if(m.RgIntro) FIN.rgIntro=String(m.RgIntro);
  if(m.RgIban) FIN.rgIban=String(m.RgIban);
  if(m.RgGruss) FIN.rgGruss=String(m.RgGruss);
  if(m.RgFooter) FIN.rgFooter=String(m.RgFooter);
  if(m.RgNext) FIN.rgNext=parseInt(m.RgNext)||1;
  try{ if(m.MuenzProRolle) FIN.muenzProRolle=Object.assign(FIN.muenzProRolle,JSON.parse(m.MuenzProRolle)); }catch(e){}
  try{ if(m.Spaetzli) FIN.sp=Object.assign(FIN.sp,JSON.parse(m.Spaetzli)); }catch(e){}
  if(m.Helferstunden!=null&&m.Helferstunden!=='') FIN.helferstd=String(m.Helferstunden);
  try{ if(m.Twint) FIN.twint=Object.assign(FIN.twint,JSON.parse(m.Twint)); }catch(e){}
  if(m.VorjahrJson){ try{ FIN.vj=Object.assign(FIN.vj,JSON.parse(m.VorjahrJson)); }catch(e){} }
  else {
    FIN.vj.kasseNetto=String(FIN.vorjahrKasse||'');
    FIN.vj.twint={anzahl:String(FIN.twint.anzahlVj||''),betrag:String(FIN.twint.betragVj||''),gebuehr:String(FIN.twint.gebuehrVj||'')};
    FIN.vj.einnahmen=FIN.einnahmen.filter(r=>!/twint/i.test(r.kat||'')&&N(r.vorjahr)).map(r=>({kat:r.kat,besch:r.besch,betrag:String(N(r.vorjahr))}));
    FIN.vj.rechnungen=FIN.rechnungen.filter(r=>N(r.vorjahr)).map(r=>({besch:(r.empfaenger&&r.empfaenger[0])||r.betreff||'Rechnung',total:String(N(r.vorjahr))}));
    FIN.vj.ausgaben=FIN.ausgaben.filter(r=>N(r.vorjahr)).map(r=>({art:r.art,kostenart:r.kostenart||'',besch:r.besch,betrag:String(N(r.vorjahr)),vorschuss:false,rueck:_isRueck(r.art)}));
  }
  FIN.einnahmen=(data.einnahmen||[]).map(r=>({kat:String(r.Kategorie||''),besch:String(r.Beschreibung||''),betrag:String(r.Betrag||''),vorjahr:String(r.Vorjahr||'')}));
  const _b=v=>v===true||v===1||v==='1'||String(v).toLowerCase()==='true';
  FIN.ausgaben=(data.ausgaben||[]).map(r=>({art:String(r.Zahlungsart||''),besch:String(r.Beschreibung||''),betrag:String(r.Betrag||''),vorjahr:String(r.Vorjahr||''),bem:String(r.Bemerkung||''),vorschuss:_b(r.Vorschuss),rueck:_b(r.Zurueckbezahlt),kostenart:String(r.Kostenart||'')}));
  FIN.stock.noten={}; FIN.stock.muenz={}; FIN.kasse.noten={}; FIN.kasse.muenz={};
  (data.stock||[]).forEach(r=>{ const w=N(r.Wert); if(w>=10) FIN.stock.noten[w]=String(r.Einzeln||''); else FIN.stock.muenz[w]={einzeln:String(r.Einzeln||''),rollen:String(r.Rollen||'')}; });
  (data.kasse||[]).forEach(r=>{ const w=N(r.Wert); if(w>=10) FIN.kasse.noten[w]=String(r.Einzeln||''); else FIN.kasse.muenz[w]={einzeln:String(r.Einzeln||''),rollen:String(r.Rollen||'')}; });

function notenSub(side){ return NOTEN.reduce((a,w)=>a+w*N(FIN[side].noten[w]),0); }
function muenzSub(side){ return MUENZ.reduce((a,w)=>{ const c=FIN[side].muenz[w]||{}; const stk=N(c.einzeln)+N(c.rollen)*rolleStk(w); return a+w*stk; },0); }
function istTotal(side){ return notenSub(side)+muenzSub(side); }
function nettoBar(){ return istTotal('kasse')-istTotal('stock'); }

function rechnungenSum(){ return FIN.rechnungen.reduce((a,r)=>a+N(r.total),0); }
function einManuell(){ return FIN.einnahmen.reduce((a,r)=>a+(/twint/i.test(r.kat||'')?0:N(r.betrag)),0); }

function einTotalVor(){ return N(FIN.vj.kasseNetto)+N(FIN.vj.twint.betrag)+_vjRgSum()+_vjEinAndere(); }
function ausTotal(){ return FIN.ausgaben.reduce((a,r)=>a+(r.vorschuss?0:N(r.betrag)),0)+N(FIN.twint.gebuehr); }
function ausTotalVor(){ return _vjAusSum(); }

function rgSave(){

  if(_rgCur._new){ delete obj._new; FIN.rechnungen.push(obj); FIN.rgNext=(FIN.rgNext||1)+1; }
  else { const idx=_rgCur._idx; delete obj._idx; FIN.rechnungen[idx]=obj; }
  _rgCur=null;

function _rgDoc(r){
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const RX=190, CA=150;
  // Absender + Logo
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(String(FIN.rgAbsender||''),20,20); doc.setFont('helvetica','normal');
  try{ doc.addImage(RG_LOGO,'PNG',158,10,34,34); }catch(e){}
  // Empfaenger links
  doc.setFontSize(11); let ey=52; (r.empfaenger||[]).forEach(l=>{ if(l){ doc.text(String(l),20,ey); ey+=5.5; } });
  // Datum + Rechnungsnummer rechtsbuendig
  doc.text('Herrliberg, '+(r.datum||''),RX,75,{align:'right'});
  doc.setFontSize(10); doc.setTextColor(110); doc.text('Rechnung '+(r.nr||''),RX,80.5,{align:'right'}); doc.setTextColor(0); doc.setFontSize(11);
  // Betreff
  let y=92; doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(String(r.betreff||''),20,y); doc.setFont('helvetica','normal'); doc.setFontSize(11);
  // Anrede
  y+=14; doc.text(String(r.anrede||''),20,y);
  // Einleitung
  y+=10; doc.splitTextToSize(String(r.intro||''),170).forEach(l=>{ doc.text(l,20,y); y+=5.5; });
  // Positionstabelle
  y+=7;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Menge',20,y); doc.text('Bezeichnung',38,y); doc.text('à CHF',CA,y,{align:'right'}); doc.text('Betrag CHF',RX,y,{align:'right'});
  doc.setLineWidth(0.2); doc.line(20,y+1.5,RX,y+1.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); y+=7;
  (r.positionen||[]).forEach(p=>{
    const lines=doc.splitTextToSize(String(p.text||''),105);
    doc.text(String(p.anzahl||''),20,y);
    doc.text(lines[0]||'',38,y);
    if(N(p.preis)) doc.text(F(N(p.preis)),CA,y,{align:'right'});
    doc.text(F(N(p.anzahl)*N(p.preis)),RX,y,{align:'right'});
    for(var k=1;k<lines.length;k++){ y+=5; doc.text(lines[k],38,y); }
    y+=7;
  });
  // Total
  y+=6;
  doc.setLineWidth(0.3); doc.line(CA-10,y-6,RX,y-6);
  doc.setFont('helvetica','bold'); doc.text('Total',20,y); doc.text('CHF '+F(r.total||rgPosTotal()),RX,y,{align:'right'}); doc.setFont('helvetica','normal');
  doc.setLineWidth(0.2); doc.line(CA-10,y+1.5,RX,y+1.5);
  // Danke + IBAN
  y+=16; doc.splitTextToSize('Danke für die Unterstützung und die Überweisung auf unser Feuerwehr-Mannschaftskonto:',170).forEach(l=>{ doc.text(l,20,y); y+=5.5; });
  doc.text('Raiffeisen, IBAN: '+(FIN.rgIban||''),20,y); y+=14;
  // Gruss
  doc.splitTextToSize(String(FIN.rgGruss||''),170).forEach(l=>{ doc.text(l,20,y); y+=5.5; });
  // Fusszeile
  if(FIN.rgFooter){ doc.setFontSize(8); doc.setTextColor(140); doc.splitTextToSize(String(FIN.rgFooter),170).forEach(function(l,i){ doc.text(l,105,283+i*4,{align:'center'}); }); doc.setTextColor(0); doc.setFontSize(11); }
  return doc;
}

function showToast(msg, kind){
  var t=document.getElementById('_toast');
  if(!t){ t=document.createElement('div'); t.id='_toast'; t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:10px 16px;border-radius:6px;font-size:14px;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:80vw;text-align:center;color:#fff'; document.body.appendChild(t); }
  var ok=(kind==='ok'||kind==='success'), err=(kind==='error');
  t.style.background=err?'#c0392b':(ok?'#1e824c':'#333');
  t.textContent=msg; t.style.display='block'; t.style.opacity='1'; t.style.transition='';
  clearTimeout(t._h); t._h=setTimeout(function(){ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(function(){ t.style.display='none'; }, 420); }, 3400);
}
function _hmMin(x){ x=String(x==null?'':x).trim(); if(!x) return null; var m=x.match(/^(\d{1,2})[:.h]?(\d{2})?/); if(!m) return null; var h=parseInt(m[1],10); if(isNaN(h)) return null; var mi=m[2]?parseInt(m[2],10):0; return h*60+mi; }
function _shiftHours(cfg){ if(!cfg) return 0; var a=_hmMin(cfg.Von), b=_hmMin(cfg.Bis); if(a==null||b==null) return 0; var d=b-a; if(d<0) d+=1440; return d/60; }
async function holHelferstunden(btn){
  var old = btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='⟳ lädt…'; }
  try{
    var r=await fetch(SCRIPT_URL+'?action=all&_='+Date.now());
    var d=JSON.parse(await r.text());
    var byTag={}; (d.config||[]).forEach(function(row){ var tag=String(row.ID!=null?row.ID:(row.Tag||'')); byTag[tag]={Von:row.Von,Bis:row.Bis}; });
    var tot=0, cnt=0, noTime=0;
    (d.signups||[]).forEach(function(s){ var tag=String(s.ID!=null?s.ID:(s.Tag||'')); var h=_shiftHours(byTag[tag]); cnt++; if(h>0) tot+=h; else noTime++; });
    tot=Math.round(tot*100)/100;
    FIN.helferstd=String(tot);
    renderEinstellungen(); renderAbrechnung();
    var hint=document.getElementById('helferHint');
    if(hint) hint.textContent='Übernommen: '+tot+' h aus '+cnt+' Anmeldungen'+(noTime?(' ('+noTime+' ohne Zeit)'):'')+'. Feld bleibt anpassbar.';
    showToast('Helferstunden übernommen: '+tot+' h'+(noTime?(' · '+noTime+' Anmeldung(en) ohne Zeit im Schichtplan'):''),'ok');
  }catch(e){
    showToast('Schichtplan konnte nicht geladen werden: '+e.message,'error');
    if(btn){ btn.disabled=false; btn.textContent=old; }
  }
}

  return { action:'abrSave', pw:PW,
    meta:{ jahr:FIN.jahr, vorjahr:FIN.vorjahr, vorjahrKasse:FIN.vorjahrKasse, einKat:FIN.einKat, ausKat:FIN.ausKat, kostKat:FIN.kostKat,
      sollStock:FIN.stock.soll, sollKasse:FIN.kasse.soll, muenzProRolle:JSON.stringify(FIN.muenzProRolle), spaetzli:JSON.stringify(FIN.sp), helferstunden:FIN.helferstd, twint:JSON.stringify(FIN.twint), vorjahrJson:JSON.stringify(FIN.vj),
      rgAbsender:FIN.rgAbsender, rgIntro:FIN.rgIntro, rgIban:FIN.rgIban, rgGruss:FIN.rgGruss, rgFooter:FIN.rgFooter, rgNext:FIN.rgNext },

    rechnungen:FIN.rechnungen.map(r=>({ nr:r.nr, datum:r.datum, empfaenger:(r.empfaenger&&r.empfaenger[0])||'', email:r.email||'', betreff:r.betreff||'', total:r.total||0, json:JSON.stringify(r) })) };
}

const SP_DEF={mehl:'5',ei:'2.5',wasser:'2.25',salz:'105',muskat:'15',portProKiste:'35',kisteProKuebel:'1',rezepteProKuebel:'1.2',eierProLiter:'20',speckProPortion:'80',kaeseProPortion:'40'};
function fmtW(g){ g=g||0; if(g>=1e6) return (g/1e6).toFixed(2).replace(/\.00$/,'')+' t'; if(g>=1000) return (g/1000).toFixed(2).replace(/\.00$/,'')+' kg'; return Math.round(g)+' g'; }
function fmtL(l){ l=l||0; return l.toFixed(2).replace(/\.00$/,'')+' l'; }
var spState={mode:'kuebel', kuebel:'1', portionen:'', kisten:''};
function spTog(id){ var b=document.getElementById('spbx-'+id), ic=document.getElementById('spic-'+id); if(!b) return; var open=b.style.display!=='none'; b.style.display=open?'none':'block'; if(ic) ic.textContent=open?'▸':'▾'; }
function spSet(mode,val){
  spState.mode=mode; spState.kuebel=''; spState.portionen=''; spState.kisten=''; spState[mode]=val;
  var map={kuebel:'sp-in-kuebel',portionen:'sp-in-port',kisten:'sp-in-kisten'};
  Object.keys(map).forEach(function(k){ if(k!==mode){ var el=document.getElementById(map[k]); if(el) el.value=''; } });
  spCalc();
}
function spCalc(){
  var sp=FIN.sp, ppk=N(sp.portProKiste)*N(sp.kisteProKuebel), rpk=N(sp.rezepteProKuebel)||1, kpk=N(sp.kisteProKuebel);
  var kuebelExact;
  if(spState.mode==='portionen'){ kuebelExact = ppk>0?N(spState.portionen)/ppk:0; }
  else if(spState.mode==='kisten'){ kuebelExact = kpk>0?N(spState.kisten)/kpk:0; }
  else { kuebelExact = N(spState.kuebel); }
  var kuebel=Math.ceil(kuebelExact*2)/2; if(!(kuebel>0)) kuebel=0;
  var portions=Math.round(kuebel*ppk), rezepte=rpk*kuebel, kisten=kuebel*kpk;
  var mehlG=N(sp.mehl)*1000*rezepte, salzG=N(sp.salz)*rezepte, muskatG=N(sp.muskat)*rezepte;
  var eiL=N(sp.ei)*rezepte, wasserL=N(sp.wasser)*rezepte, eier=Math.ceil(eiL*N(sp.eierProLiter));
  var speckG=N(sp.speckProPortion)*portions, boelleG=speckG/2, kaeseG=N(sp.kaeseProPortion)*portions;
  var rest = (Math.abs(kuebelExact-kuebel)>0.001 && kuebelExact>0) ? `<div class="muted" style="font-size:11px;margin-top:4px">aufgerundet von ${kuebelExact.toFixed(2)} Kübel</div>` : '';
  var row=(l,v)=>`<div class="kv"><span>${l}</span><span>${v}</span></div>`;
  var out=document.getElementById('sp-out');
  if(out) out.innerHTML=`
    <div style="font-weight:700;margin-bottom:4px">Zutaten</div>
    ${row('Mehl',fmtW(mehlG))}${row('Eier',eier+' Stück')}${row('Wasser',fmtL(wasserL))}${row('Salz',fmtW(salzG))}${row('Muskat',fmtW(muskatG))}
    <div class="kv total"><span>Kübel</span><span>${kuebel}</span></div>
    <div class="kv total"><span>Rezepte</span><span>${(Math.round(rezepte*10)/10)}</span></div>
    <div class="kv total"><span>Migros-Kisten</span><span>${(Math.round(kisten*10)/10)}</span></div>
    <div class="kv total"><span>Portionen</span><span>${portions}</span></div>
    ${rest}
    <div style="font-weight:700;margin:14px 0 4px">Braten</div>
    ${row('Speck',fmtW(speckG))}${row('Bölle',fmtW(boelleG))}
    <div style="font-weight:700;margin:14px 0 4px">Käse</div>
    ${row('Käse',fmtW(kaeseG))}`;
  var bp=document.getElementById('sp-boelle-pp'); if(bp) bp.textContent=fmtW(N(sp.speckProPortion)/2)+' / Portion';
}
function renderSpaetzli(){

function abrPrint(){
  var sec=document.getElementById('sec-abrechnung'); if(!sec) return;
  if(!sec.querySelector('.card')) renderAbrechnung();
  var old=document.getElementById('abrPrintWrap'); if(old) old.remove();
  sec.querySelectorAll('.detrow.show').forEach(function(r){ r.classList.remove('show'); });
  sec.querySelectorAll('[id^="ico-"]').forEach(function(ic){ ic.textContent='▸'; });
  var abrCard=sec.querySelector('.card');
  var clone=abrCard.cloneNode(true);
  clone.querySelectorAll('.detrow').forEach(function(r){ r.style.display='table-row'; });
  clone.querySelectorAll('[id^="ico-"]').forEach(function(ic){ ic.textContent='▾'; ic.removeAttribute('id'); });
  var ct=clone.querySelector('.card-title'); if(ct) ct.innerHTML='Abrechnung '+esc(FIN.jahr)+' – Details';
  var wrap=document.createElement('div'); wrap.id='abrPrintWrap'; wrap.appendChild(clone);
  sec.appendChild(wrap);
  document.body.classList.add('abr-printing');
  setTimeout(function(){ window.print(); }, 60);
}

function _csvCell(c){ c=String(c==null?'':c); return /[";\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }
function _csvRow(arr){ return arr.map(_csvCell).join(';'); }
function _norm(x){ return String(x==null?'':x).trim().toLowerCase(); }
function _aoa(name,wb){ var ws=wb.Sheets[name]; return ws?XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}):[]; }
function _rowsObj(rows){ if(!rows||!rows.length) return []; var h=rows[0].map(function(x){return String(x==null?'':x).trim();}); return rows.slice(1).map(function(r){ var o={}; h.forEach(function(k,i){ o[k]=r[i]; }); return o; }); }
function finExport(){
  if(typeof XLSX==='undefined'){ showToast('Excel-Bibliothek noch nicht geladen – kurz warten und erneut.','error'); return; }
  var wb=XLSX.utils.book_new();
  var meta=[['Feld','Wert'],['jahr',FIN.jahr],['vorjahr',FIN.vorjahr],['kasseNetto',nettoBar()],['helferstunden',FIN.helferstd],['einKat',(FIN.einKat||[]).join(',')],['ausKat',(FIN.ausKat||[]).join(',')],['kostKat',(FIN.kostKat||[]).join(',')],['rgNext',FIN.rgNext],['spaetzli',JSON.stringify(FIN.sp)]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(meta),'Meta');
  var t=FIN.twint;
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Anzahl','Betrag','Gebuehr'],[N(t.anzahl),N(t.betrag),N(t.gebuehr)]]),'TWINT');
  var ein=[['Kategorie','Beschreibung','Betrag']]; FIN.einnahmen.forEach(function(r){ ein.push([r.kat,r.besch,N(r.betrag)]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ein),'Einnahmen');
  var aus=[['Zahlungsart','Kostenart','Beschreibung','Betrag','Bemerkung','Vorschuss','Rueckzahlung']]; FIN.ausgaben.forEach(function(r){ aus.push([r.art,r.kostenart||'',r.besch,N(r.betrag),r.bem||'',r.vorschuss?1:'',r.rueck?1:'']); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aus),'Ausgaben');
  var rg=[['Nr','Datum','Empfaenger','Total','Abgeschlossen','JSON']]; FIN.rechnungen.forEach(function(r){ rg.push([r.nr,r.datum,(r.empfaenger&&r.empfaenger[0])||'',N(r.total),r.abgeschlossen?1:'',JSON.stringify(r)]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rg),'Rechnungen');
  var vein=[['Kategorie','Beschreibung','Betrag']]; FIN.vj.einnahmen.forEach(function(r){ vein.push([r.kat,r.besch,N(r.betrag)]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(vein),'VJ-Einnahmen');
  var vaus=[['Zahlungsart','Kostenart','Beschreibung','Betrag']]; FIN.vj.ausgaben.forEach(function(r){ vaus.push([r.art,r.kostenart||'',r.besch,N(r.betrag)]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(vaus),'VJ-Ausgaben');
  var vrg=[['Beschreibung','Total']]; FIN.vj.rechnungen.forEach(function(r){ vrg.push([r.besch,N(r.total)]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(vrg),'VJ-Rechnungen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['KasseNetto','TWINT-Anzahl','TWINT-Betrag','TWINT-Gebuehr'],[N(FIN.vj.kasseNetto),N(FIN.vj.twint.anzahl),N(FIN.vj.twint.betrag),N(FIN.vj.twint.gebuehr)]]),'VJ-Meta');
  XLSX.writeFile(wb,'chilbi_finanzen_'+(FIN.jahr||'export')+'.xlsx');
}
function finImport(input, mode){
  if(typeof XLSX==='undefined'){ showToast('Excel-Bibliothek noch nicht geladen – kurz warten und erneut.','error'); return; }
  var file=input.files&&input.files[0]; if(!file){ return; }
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var meta={}; _aoa('Meta',wb).slice(1).forEach(function(r){ if(r[0]!=null&&r[0]!=='') meta[String(r[0]).trim()]=r[1]; });
      var ein=_rowsObj(_aoa('Einnahmen',wb)), aus=_rowsObj(_aoa('Ausgaben',wb)), rg=_rowsObj(_aoa('Rechnungen',wb));
      var twR=_aoa('TWINT',wb); var tw= twR.length>1?{anzahl:twR[1][0],betrag:twR[1][1],gebuehr:twR[1][2]}:null;
      var setKat=function(k){ return String(k||'').split(',').map(function(x){return x.trim();}).filter(Boolean); };
      if(mode==='vorjahr'){
        if(!confirm('Vorjahreszahlen aus dieser Excel-Datei importieren?\n\nDie aktuellen Werte der Datei werden als VORJAHRESZAHLEN übernommen (bestehende Vorjahreszahlen werden ersetzt).')){ input.value=''; return; }
        FIN.vorjahr=String(meta.jahr||FIN.vorjahr||'');
        FIN.vj.kasseNetto=String(N(meta.kasseNetto)||'');
        FIN.vj.twint={anzahl:String(tw?(N(tw.anzahl)||''):''),betrag:String(tw?(N(tw.betrag)||''):''),gebuehr:String(tw?(N(tw.gebuehr)||''):'')};
        FIN.vj.einnahmen=ein.filter(function(r){ return !/twint/i.test(String(r.Kategorie||'')); }).map(function(r){ return {kat:String(r.Kategorie||''),besch:String(r.Beschreibung||''),betrag:String(N(r.Betrag)||'')}; });
        FIN.vj.rechnungen=rg.map(function(r){ return {besch:String(r.Empfaenger||r.Beschreibung||r.Nr||'Rechnung'),total:String(N(r.Total)||'')}; });
        FIN.vj.ausgaben=aus.map(function(r){ return {art:String(r.Zahlungsart||''),kostenart:String(r.Kostenart||''),besch:String(r.Beschreibung||''),betrag:String(N(r.Betrag)||''),vorschuss:false,rueck:!!N(r.Rueckzahlung)}; });
        showToast('Vorjahreszahlen importiert – prüfen und speichern.','ok');
      } else {
        if(!confirm('Backup 1:1 wiederherstellen?\n\nÜberschreibt die aktuelle Bearbeitung komplett (ohne Bargeld-Zählung).')){ input.value=''; return; }
        if(meta.jahr!=null) FIN.jahr=String(meta.jahr);
        if(meta.vorjahr!=null) FIN.vorjahr=String(meta.vorjahr);
        if(meta.helferstunden!=null) FIN.helferstd=String(meta.helferstunden);
        if(meta.einKat) FIN.einKat=setKat(meta.einKat);
        if(meta.ausKat) FIN.ausKat=setKat(meta.ausKat);
        if(meta.kostKat) FIN.kostKat=setKat(meta.kostKat);
        if(meta.rgNext) FIN.rgNext=parseInt(meta.rgNext)||1;
        try{ if(meta.spaetzli) FIN.sp=Object.assign(FIN.sp,JSON.parse(meta.spaetzli)); }catch(e){}
        FIN.einnahmen=ein.map(function(r){ return {kat:String(r.Kategorie||''),besch:String(r.Beschreibung||''),betrag:String(N(r.Betrag)||''),vorjahr:''}; });
        FIN.ausgaben=aus.map(function(r){ return {art:String(r.Zahlungsart||''),kostenart:String(r.Kostenart||''),besch:String(r.Beschreibung||''),betrag:String(N(r.Betrag)||''),vorjahr:'',bem:String(r.Bemerkung||''),vorschuss:!!N(r.Vorschuss),rueck:!!N(r.Rueckzahlung)}; });
        FIN.rechnungen=rg.map(function(r){ var o=null; try{ o=JSON.parse(r.JSON); }catch(e){} return o||{nr:String(r.Nr||''),datum:String(r.Datum||''),empfaenger:[String(r.Empfaenger||'')],total:N(r.Total),abgeschlossen:!!N(r.Abgeschlossen),positionen:[],intro:'',vorjahr:''}; });
        if(tw) FIN.twint={anzahl:String(N(tw.anzahl)||''),betrag:String(N(tw.betrag)||''),gebuehr:String(N(tw.gebuehr)||''),anzahlVj:'',betragVj:'',gebuehrVj:''};
        var vein=_rowsObj(_aoa('VJ-Einnahmen',wb)), vaus=_rowsObj(_aoa('VJ-Ausgaben',wb)), vrg=_rowsObj(_aoa('VJ-Rechnungen',wb)), vm=_aoa('VJ-Meta',wb);
        FIN.vj.einnahmen=vein.map(function(r){ return {kat:String(r.Kategorie||''),besch:String(r.Beschreibung||''),betrag:String(N(r.Betrag)||'')}; });
        FIN.vj.ausgaben=vaus.map(function(r){ return {art:String(r.Zahlungsart||''),kostenart:String(r.Kostenart||''),besch:String(r.Beschreibung||''),betrag:String(N(r.Betrag)||''),vorschuss:false,rueck:false}; });
        FIN.vj.rechnungen=vrg.map(function(r){ return {besch:String(r.Beschreibung||''),total:String(N(r.Total)||'')}; });
        if(vm.length>1){ FIN.vj.kasseNetto=String(N(vm[1][0])||''); FIN.vj.twint={anzahl:String(N(vm[1][1])||''),betrag:String(N(vm[1][2])||''),gebuehr:String(N(vm[1][3])||'')}; }
        showToast('Backup wiederhergestellt – prüfen und speichern.','ok');
      }
      renderAll();
    }catch(e){ showToast('Import-Fehler: '+e.message,'error'); }
    input.value='';
  };
  rd.readAsArrayBuffer(file);
}
